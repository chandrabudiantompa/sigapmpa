<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Update Icon SIGAP MPA</title>
<style>
body{font-family:Arial,sans-serif;background:#111318;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px}
main{max-width:560px;text-align:center;background:#1f2329;border:1px solid #333943;border-radius:20px;padding:28px;box-shadow:0 20px 70px rgba(0,0,0,.35)}
img{width:96px;height:96px;border-radius:22px;margin-bottom:12px;box-shadow:0 10px 28px rgba(0,0,0,.35)}
button{border:0;border-radius:12px;background:#d60812;color:#fff;padding:13px 18px;font-weight:800}
small{color:#aeb3bb;display:block;margin-top:10px;line-height:1.5}
</style></head><body><main>
<img src="icons/icon-192.png?v=1.9.3" alt="SIGAP Icon">
<h1>Update Icon SIGAP MPA</h1>
<p>Membersihkan cache icon, favicon, manifest, dan service worker lama.</p>
<button id="go">Buka SIGAP</button>
<small>Jika icon HP masih lama, hapus shortcut/aplikasi SIGAP lama lalu install ulang dari Chrome.</small>
</main>
<script>
async function clearOld(){
  try{ if('serviceWorker' in navigator){ const regs=await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.unregister())); } }catch(e){}
  try{ if('caches' in window){ const keys=await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); } }catch(e){}
}
document.getElementById('go').onclick=async()=>{await clearOld();location.href='./?icon=1.9.3&t='+Date.now();};
clearOld().then(()=>setTimeout(()=>{location.href='./?icon=1.9.3&t='+Date.now();},1300));
</script></body></html>
